name: Python CI

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  # nn STAGE 1: Code Review nnnnnnnnnnnnnnnnnnnnnnnnn
  lint:
    name: Code Review (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        run: flake8 . --max-line-length=88

  # nn STAGE 2: Tests (only if lint passes) nnnnnnnnn
  test:
    name: Automated Tests (pytest) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint # <-- quality gate

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --tb=short